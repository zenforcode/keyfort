version: '3.8'

services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
      - ./foundationdb.conf:/etc/foundationdb/foundationdb.conf:ro
      - ./fdb.cluster:/etc/foundationdb/fdb.cluster:ro
    command: sleep infinity
    networks:
      - devnet
    depends_on:
      - keycloak
      - foundationdb

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    networks:
      - devnet

  foundationdb:
    image: foundationdb/foundationdb:7.1.27
    ports:
      - "4500:4500"
    networks:
      - devnet
    cap_add:
      - IPC_LOCK
    environment:
      - FDB_NETWORKING_MODE=host

networks:
  devnet:
    driver: bridge

